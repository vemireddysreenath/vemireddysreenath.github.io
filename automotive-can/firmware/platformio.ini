; MVP1: ESP32-S3 CAN (TWAI) listen-only monitor.
; See ../README.md before your first flash (wiring, safety checklist,
; build/flash/monitor commands, troubleshooting).

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; ESP32-S3-DevKitC-1 boards vary by revision: recent ones expose only the
; native USB-OTG port (Serial over USB CDC -- needs the two flags below).
; Some revisions/clones add a second CP2102/CH9102 "UART" port that works
; without these flags. See ../README.md "USB port: two possible
; configurations" before your first flash.
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
